    <rect x="40" y="40" width="250" height="210" fill="url(#sky)"/>
    <rect x="40" y="40" width="250" height="210" fill="url(#sun)"/>
    <g fill="#fff">
      <circle cx="112" cy="128" r="26"/><circle cx="142" cy="108" r="36"/><circle cx="180" cy="120" r="28"/>
      <circle cx="206" cy="134" r="20"/><circle cx="90" cy="142" r="18"/>
      <rect x="84" y="134" width="134" height="24" rx="12"/>
    </g>
    <g fill="#dbe9f4" opacity=".9">
      <path d="M84 150C110 160 190 162 220 148C218 158 206 162 196 162H96C88 162 84 156 84 150Z"/>
    </g>
    <g fill="#fff" opacity=".85">
      <circle cx="250" cy="78" r="12"/><circle cx="266" cy="72" r="15"/><circle cx="282" cy="80" r="10"/>
      <rect x="244" y="78" width="44" height="10" rx="5"/>
    </g>
    <path d="M40 212Q90 186 150 200T290 190V250H40Z" fill="url(#hill)"/>
    <path d="M40 232Q80 214 120 226T200 220T290 226V250H40Z" fill="#5e9a68"/>
    <g fill="#4f8a5c">
