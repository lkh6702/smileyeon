    <path d="M430 92H580M430 156H580" stroke="#e4d8cb" stroke-width="5"/>
    <g>
      <rect x="440" y="48" width="12" height="42" fill="#c98476"/><rect x="454" y="44" width="10" height="46" fill="#7fa3bd"/>
      <rect x="466" y="50" width="14" height="40" fill="#e2c27c"/><rect x="482" y="46" width="9" height="44" fill="#8fb79a"/>
      <rect x="493" y="52" width="13" height="38" fill="#b9a2c8"/>
      <rect x="440" y="112" width="11" height="42" fill="#7fa3bd"/><rect x="453" y="116" width="14" height="38" fill="#e8a998"/>
      <rect x="469" y="110" width="10" height="44" fill="#6f8f7c"/><rect x="481" y="114" width="13" height="40" fill="#e2c27c"/>
      <rect x="520" y="170" width="12" height="52" fill="#c98476"/><rect x="534" y="176" width="10" height="46" fill="#7fa3bd"/>
      <rect x="546" y="172" width="14" height="50" fill="#8fb79a"/>
    </g>
