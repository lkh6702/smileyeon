      <ellipse cx="248" cy="214" rx="12" ry="16"/><ellipse cx="262" cy="220" rx="9" ry="12"/>
    </g>
    <rect x="40" y="40" width="250" height="210" fill="none" stroke="#fff" stroke-width="10"/>
    <path d="M165 40V250M40 150H290" stroke="#fff" stroke-width="6"/>
    <rect x="30" y="246" width="270" height="10" rx="3" fill="#fff"/>
    <rect x="32" y="30" width="266" height="14" rx="4" fill="#e9e2da"/>
  </g>

