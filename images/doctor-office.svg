<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="진료실 책상에 앉아 진료하는 황연희 원장 일러스트">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf3ea"/><stop offset="1" stop-color="#f1e4d6"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fa8dc"/><stop offset=".6" stop-color="#9fd0ee"/><stop offset="1" stop-color="#e3f3f8"/></linearGradient>
    <radialGradient id="sun" cx=".15" cy=".1" r=".6"><stop offset="0" stop-color="#fffbe6" stop-opacity=".9"/><stop offset="1" stop-color="#fffbe6" stop-opacity="0"/></radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8dccd"/><stop offset="1" stop-color="#cdb9a3"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5e3f31"/><stop offset=".6" stop-color="#7a5444"/><stop offset="1" stop-color="#8d6350"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde8da"/><stop offset="1" stop-color="#f7d3bf"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6edf2"/></linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fcf8a"/><stop offset="1" stop-color="#6fae74"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <!-- 벽 -->
  <rect width="600" height="450" fill="url(#wall)"/>

