  <!-- 팔 · 손 (펜을 들고 차트를 보는 모습) -->
  <path d="M232 300C214 318 216 338 238 344H286C294 340 292 330 284 328L252 326C254 316 250 306 244 298Z" fill="url(#coat)" stroke="#d5dde3" stroke-width="1.5"/>
  <path d="M368 300C386 318 384 338 362 344H318C310 340 312 330 320 328L348 326C346 316 350 306 356 298Z" fill="url(#coat)" stroke="#d5dde3" stroke-width="1.5"/>
  <ellipse cx="290" cy="338" rx="12" ry="7" fill="#f7d3bf"/>
  <ellipse cx="314" cy="338" rx="12" ry="7" fill="#f7d3bf"/>
  <path d="M316 336L340 318" stroke="#3d5a80" stroke-width="3" stroke-linecap="round"/>

  <!-- 책상 -->
  <rect x="0" y="340" width="600" height="110" fill="url(#desk)"/>
  <rect x="0" y="336" width="600" height="10" fill="#f4ede5"/>
  <!-- 차트 종이 -->
  <path d="M250 344L350 344L360 372L240 372Z" fill="#fff" stroke="#e1d8cf"/>
  <path d="M262 352H336M260 358H330M258 364H322" stroke="#cfd6dc" stroke-width="2"/>
  <!-- 머그컵 -->
  <rect x="150" y="306" width="30" height="34" rx="6" fill="#ef8475"/>
  <path d="M180 314C192 314 192 330 180 330" fill="none" stroke="#ef8475" stroke-width="5"/>
  <path d="M160 300Q156 290 162 282M170 300Q166 290 172 282" fill="none" stroke="#fff" stroke-width="2.5" opacity=".7" stroke-linecap="round"/>
