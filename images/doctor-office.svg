    <ellipse cx="177" cy="206" rx="8" ry="9" fill="#3a2620"/>
    <ellipse cx="223" cy="206" rx="8" ry="9" fill="#3a2620"/>
    <ellipse cx="177" cy="208" rx="5" ry="5.5" fill="#6b4a3a"/>
    <ellipse cx="223" cy="208" rx="5" ry="5.5" fill="#6b4a3a"/>
    <circle cx="180" cy="202" r="3" fill="#fff"/><circle cx="226" cy="202" r="3" fill="#fff"/>
    <circle cx="174" cy="211" r="1.4" fill="#fff" opacity=".8"/><circle cx="220" cy="211" r="1.4" fill="#fff" opacity=".8"/>
    <path d="M163 202Q177 190 191 201M209 201Q223 190 237 202" fill="none" stroke="#2e1d18" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="164" cy="232" rx="14" ry="7" fill="#f3958a" opacity=".4" filter="url(#soft)"/>
    <ellipse cx="236" cy="232" rx="14" ry="7" fill="#f3958a" opacity=".4" filter="url(#soft)"/>
