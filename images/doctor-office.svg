    <path d="M541 70V46" stroke="#6ea06a" stroke-width="12" stroke-linecap="round"/>
    <circle cx="541" cy="42" r="6" fill="#e86a6a"/>
    <rect x="512" y="134" width="30" height="20" rx="4" fill="#d9d4cf"/>
    <g fill="#88b884"><ellipse cx="520" cy="128" rx="8" ry="10"/><ellipse cx="532" cy="124" rx="9" ry="12"/><ellipse cx="540" cy="130" rx="7" ry="9"/></g>
  </g>

