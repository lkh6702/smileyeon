    <path d="M144 194C144 140 168 120 200 120C232 120 256 140 256 194C256 240 236 280 200 287C164 280 144 240 144 194Z" fill="url(#skin)" stroke="#e8b9a0" stroke-width="1.5"/>
    <path d="M140 170C136 108 170 86 200 86C230 86 264 108 260 170C250 136 228 116 200 114C172 116 150 136 140 170Z" fill="url(#hair)"/>
    <path d="M200 110C168 112 144 134 138 170C135 194 138 218 132 244C148 226 155 200 161 178C169 152 184 134 200 122Z" fill="url(#hair)"/>
    <path d="M200 110C232 112 256 134 262 170C265 194 262 218 268 244C252 226 245 200 239 178C231 152 216 134 200 122Z" fill="url(#hair)"/>
    <path d="M134 232C124 272 126 312 108 348C130 346 150 322 153 296C155 272 146 250 134 232Z" fill="url(#hair)"/>
    <path d="M266 232C276 272 274 312 292 348C270 346 250 322 247 296C245 272 254 250 266 232Z" fill="url(#hair)"/>
    <path d="M150 140C142 176 142 212 136 240M250 140C258 176 258 212 264 240M176 100Q200 92 226 102" fill="none" stroke="#b0846c" stroke-width="2.5" opacity=".55" stroke-linecap="round"/>
