  <g transform="translate(300 192) scale(.62) translate(-200 -200)">
    <path d="M116 200C104 118 150 56 204 56C262 56 306 112 294 205C290 250 300 290 318 330C326 348 312 362 296 352C288 348 282 358 272 350H130C120 358 112 348 104 352C88 362 76 346 84 330C102 292 112 250 116 200Z" fill="url(#hair)"/>
