  <g fill="#7db37a"><ellipse cx="80" cy="300" rx="9" ry="15" transform="rotate(-20 80 300)"/><ellipse cx="94" cy="296" rx="9" ry="16" transform="rotate(18 94 296)"/><ellipse cx="87" cy="292" rx="7" ry="16"/></g>
  <!-- 모니터 (뒷면) -->
  <rect x="420" y="232" width="130" height="90" rx="10" fill="#f6f7f8" stroke="#d6dbdf" stroke-width="2"/>
  <circle cx="485" cy="292" r="12" fill="none" stroke="#e1e5e8" stroke-width="3"/>
  <rect x="476" y="320" width="18" height="18" fill="#e7eaec"/>
  <ellipse cx="485" cy="340" rx="30" ry="5" fill="#dfe3e6"/>

  <!-- 햇살 반짝임 -->
  <g fill="#fff" opacity=".7">
    <circle cx="330" cy="120" r="2"/><circle cx="360" cy="90" r="1.5"/><circle cx="390" cy="140" r="2"/>
  </g>
</svg>
